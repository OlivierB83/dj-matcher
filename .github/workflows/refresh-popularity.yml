name: Refresh Spotify popularity

# Re-snapshots the `popularity` field of every catalog entry via ReccoBeats
# (which proxies Spotify's official Track endpoint). Commits the diff back
# to main — Vercel + Render then redeploy automatically.
#
# Schedule: Sundays at 03:00 UTC. Also triggerable manually via the
# "Run workflow" button in the Actions tab.

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run popularity refresh
        run: node refresh-popularity.js

      - name: Commit if changed
        run: |
          if git diff --quiet knownTracks.json; then
            echo "No popularity changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knownTracks.json
          git commit -m "chore: weekly Spotify popularity refresh"
          git push origin main
