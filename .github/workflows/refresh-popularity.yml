name: Refresh Deezer popularity

# Re-snapshots the `popularity` field of every catalog entry from the Deezer
# public API (rank 0…1 000 000 → 0…100). Spotify stopped exposing
# popularity to development-mode apps in 2026, so Deezer is the source now.
# Commits the diff back to main — Vercel + Render then redeploy automatically.
#
# Schedule: Sundays at 03:00 UTC. Also triggerable manually via the
# "Run workflow" button in the Actions tab.
#
# NB: GitHub disables scheduled workflows after 60 days without repo
# activity ("disabled_inactivity") — re-enable it from the Actions tab.

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Deezer popularity refresh
        run: node refresh-popularity-deezer.js

      - name: Commit if changed
        run: |
          if git diff --quiet knownTracks.json; then
            echo "No popularity changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knownTracks.json
          git commit -m "chore: weekly Deezer popularity refresh"
          git push origin main
