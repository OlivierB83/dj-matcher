<style>
  /* Palette = src/styles/tokens.css */
  :root {
    --bg-app: #0f1115; --text-primary: #ffffff; --text-muted: #d5d7dd; --text-dim: #a3a7b0; --text-faint: #6b6f78;
    --brand: #7f77dd; --brand-dark: #534ab7; --bg-input: rgba(255,255,255,.06); --border-strong: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 20px;
    background: var(--bg-app); color: var(--text-primary);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; text-align: center; }
  .logo { display: block; width: 88px; height: 88px; margin: 0 auto 24px; border-radius: 20px; }
  h1 { margin: 0 0 6px; font-size: clamp(34px, 7vw, 52px); font-weight: 700; letter-spacing: -0.02em; }
  .tagline { margin: 0 0 20px; font-size: clamp(19px, 3.4vw, 24px); color: var(--text-muted); }
  .pitch { margin: 0 0 32px; color: var(--text-dim); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; padding: 14px 24px; border-radius: 10px;
    font: inherit; font-weight: 600; text-decoration: none; border: 1px solid transparent;
  }
  .btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-disabled { background: var(--bg-input); border-color: var(--border-strong); color: var(--text-faint); cursor: not-allowed; }
  footer { margin-top: 48px; font-size: 14px; color: var(--text-faint); }
  footer a { color: var(--text-dim); }
</style>
